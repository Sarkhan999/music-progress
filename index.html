<html lang="en">
<head>

<style>
:root {
  --bg: #F2F3F0; --surface: #FFFFFF; --ink: #15171C; --muted: #5B606C; --line: #D8DBD4;
  --accent: #E3A900; --focus: #2457C5; --good: #157A47; --bad: #C2323A; --warn: #A86400;

}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121418; --surface: #1B1E24; --ink: #ECEDEF; --muted: #9CA2AE; --line: #2D313A;
  --accent: #F2B705; --focus: #8FB0F7; --good: #6CCF98; --bad: #F28A8F; --warn: #E8B04B;
  --guitar: #F08A5A; --drums: #86A9F6; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #121418; --surface: #1B1E24; --ink: #ECEDEF; --muted: #9CA2AE; --line: #2D313A;
  --accent: #F2B705; --focus: #8FB0F7; --good: #6CCF98; --bad: #F28A8F; --warn: #E8B04B;
  --guitar: #F08A5A; --drums: #86A9F6; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; }
.wrap { max-width: 860px; margin: 0 auto; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 56px max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3 { font-family: var(--display); margin: 0; line-height: 1.1; }
h1 { font-size: 2.3rem; font-weight: 700; }
h2 { font-size: 1.6rem; font-weight: 700; }
h3 { font-size: 1.3rem; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: .9rem; }
.kicker { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.between { justify-content: space-between; }
.i-guitar { --i: var(--guitar); }
.i-drums { --i: var(--drums); }
[hidden] { display: none !important; }
a { color: var(--focus); }
header { display: flex; flex-direction: column; gap: 12px; }
.back { font-size: .9rem; color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
.stat b { display: block; font-family: var(--display); font-size: 1.7rem; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
@media (max-width: 520px) { .stats { grid-template-columns: 1fr; } }
.note { background: var(--surface); border: 1px dashed var(--line); padding: 10px 14px; border-radius: 10px; color: var(--muted); font-size: .92rem; }

nav.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
nav.tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 12px 7px; cursor: pointer;
  font: 600 1.05rem var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

.btn { font: 600 .98rem var(--body); padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); cursor: pointer; }
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.ghost { background: transparent; }
.btn.sm { font-size: .88rem; padding: 5px 10px; }
.btn.warn { color: var(--bad); border-color: var(--bad); }
.btn.danger { background: var(--bad); color: var(--surface); border-color: var(--bad); }
.btn.inst { color: var(--i); border-color: var(--i); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0; }
textarea { min-height: 90px; resize: vertical; }
label { display: flex; flex-direction: column; gap: 3px; font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
label.full { grid-column: 1 / -1; }
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 520px) { .form { grid-template-columns: 1fr; } }
.status { font-size: .9rem; color: var(--good); min-height: 1.4em; }

.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 680px) { .cards { grid-template-columns: 1fr; } }
.card { background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--i, var(--line)); border-radius: 14px;
  padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.inst h2 { color: var(--i); }
.lvl { font: 600 .8rem var(--body); padding: 2px 10px; border-radius: 999px; background: var(--bg); color: var(--i); border: 1px solid var(--i); white-space: nowrap; }
.bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--i); }
.inst ol { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 3px; }
.inst ol small { color: var(--muted); margin-left: 6px; }
.due { color: var(--warn); font-weight: 600; }

.chart { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; align-items: end; height: 160px; border-bottom: 1px solid var(--line); }
.wk { display: flex; flex-direction: column; justify-content: flex-end; height: 100%; gap: 4px; min-width: 0; }
.wk .bars { display: flex; gap: 2px; align-items: flex-end; height: 100%; }
.wk .bars i { flex: 1; min-height: 0; border-radius: 3px 3px 0 0; background: var(--i); display: block; }
.wk .bars i.g { --i: var(--guitar); }
.wk .bars i.d { --i: var(--drums); }
.wk span { font-size: .72rem; color: var(--muted); text-align: center; white-space: nowrap; overflow: hidden; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--i); margin: 0 4px 0 10px; vertical-align: middle; }
.sw.i-guitar { --i: var(--guitar); } .sw.i-drums { --i: var(--drums); }

.list { display: flex; flex-direction: column; gap: 8px; }
.logrow { display: grid; grid-template-columns: 4.6em minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 12px;
  background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--i); border-radius: 10px; }
.logrow time { color: var(--muted); font-size: .88rem; }
.logrow small { display: block; color: var(--muted); }
.skillgroup { display: flex; flex-direction: column; gap: 8px; }
.skill { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--i); border-radius: 10px; padding: 10px 12px;
  display: flex; flex-direction: column; gap: 6px; }
.skill select { width: auto; }
.skill details summary { cursor: pointer; color: var(--muted); font-size: .9rem; }
.skill details p { margin-top: 6px; }
.skill .stag { font-size: .85rem; color: var(--muted); }
.skill .stag.due { color: var(--warn); }
.dots { display: flex; gap: 3px; }
.dots i { width: 9px; height: 9px; border-radius: 2px; background: var(--line); }
.dots i.on { background: var(--i); }
.mini { font-size: .85rem; color: var(--muted); }
.backup textarea { font-family: ui-monospace, Consolas, monospace; font-size: .85rem; }
#view { display: flex; flex-direction: column; gap: 14px; }
.metro { position: sticky; top: 0; z-index: 5; padding-top: calc(12px + env(safe-area-inset-top, 0px)); }
.metro .bpm { width: 5.5em; font: 600 1.2rem var(--display); text-align: center; }
.lesson { gap: 12px; }
.lhead { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: start; background: none; border: 0; padding: 0;
  text-align: left; color: var(--ink); font: inherit; cursor: pointer; }
.lnum { font: 700 1.7rem var(--display); color: var(--i); line-height: 1; font-variant-numeric: tabular-nums; }
.ltitle { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ltitle strong { font: 700 1.35rem var(--display); }
.lpct { font: 600 1.2rem var(--display); color: var(--muted); }
.chords { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 10px; }
.chord { display: flex; flex-direction: column; align-items: center; gap: 6px; background: var(--bg); border-radius: 10px; padding: 10px 8px; min-width: 0; }
.chord svg { width: 90px; height: 100px; color: var(--ink); }
.chord strong { font: 700 1.4rem var(--display); }
.chord select { font-size: .82rem; padding: 4px 6px; }
.chg { display: grid; grid-template-columns: 6.5em 9.5em minmax(0, 1fr) auto; gap: 10px; align-items: center; background: var(--bg); border-radius: 10px; padding: 8px 12px; }
.chg input { padding: 4px 8px; }
@media (max-width: 560px) { .chg { grid-template-columns: 1fr 1fr; } .chg .bar { grid-column: 1 / -1; } }
label.inline { text-transform: none; letter-spacing: 0; font-size: .8rem; }
.drill { background: var(--bg); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.pat { font-family: ui-monospace, Consolas, monospace; font-size: .9rem; background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
  padding: 6px 10px; align-self: flex-start; white-space: pre; overflow-x: auto; max-width: 100%; line-height: 1.45; }
.chip { font: 600 .85rem var(--body); padding: 3px 10px; border-radius: 999px; border: 2px solid var(--i); background: transparent; color: var(--ink);
  cursor: pointer; font-variant-numeric: tabular-nums; }
.chip.on { background: var(--i); color: var(--surface); }
.tips ul { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 8px; }
.tips li b { color: var(--i, var(--ink)); }
.tempos { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
.tempos div { background: var(--bg); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; }
.tempos b { font: 700 1.3rem var(--display); }
.tempos span { font-size: .85rem; color: var(--muted); }
</style>
</head>

<script>

const YT = q => "https://www.youtube.com/results?search_query=" + encodeURIComponent(q);
// Chord shapes, strings low E to high e. f: fret (-1 = don't play, 0 = open), fi: finger (1 index … 4 pinky), barre: fret held by the index.
const CHORDS = {
  G: { f: [3, 2, 0, 0, 0, 3], fi: [2, 1, 0, 0, 0, 3] },
  C: { f: [-1, 3, 2, 0, 1, 0], fi: [0, 3, 2, 0, 1, 0] },

  A7: { f: [-1, 0, 2, 0, 2, 0], fi: [0, 0, 2, 0, 3, 0] },
  D7: { f: [-1, -1, 0, 2, 1, 2], fi: [0, 0, 0, 2, 1, 3] },
  Cadd9: { f: [-1, 3, 2, 0, 3, 3], fi: [0, 2, 1, 0, 3, 4] },
  F: { f: [1, 3, 3, 2, 1, 1], fi: [1, 3, 4, 2, 1, 1], barre: 1 },
  Bm: { f: [-1, 2, 4, 4, 3, 2], fi: [0, 1, 3, 4, 2, 1], barre: 2 },
  B7: { f: [-1, 2, 1, 2, 0, 2], fi: [0, 2, 1, 3, 0, 4] },
  E5: { f: [0, 2, 2, -1, -1, -1], fi: [0, 1, 3, 0, 0, 0] },

// Lessons: chords to rate, chord pairs for one-minute changes, and drills with a tempo ladder (BPM steps to play cleanly).
const LESSONS = {
  guitar: [
    { id: "g1", title: "Your first chords", goal: "Play G, C, D, Em and Am cleanly and switch between them. These five cover thousands of songs.",
      chords: ["G", "C", "D", "Em", "Am"], changes: [["G", "C"], ["C", "D"], ["G", "D"], ["Em", "Am"], ["Am", "C"], ["G", "Em"]],
      drills: [
        { id: "g-down4", name: "Down strums on every beat", pattern: "D   D   D   D", unit: "quarter notes", ladder: [60, 70, 80, 90, 100],
          how: "One down strum per click. Play G for 4 strums, then C for 4, without stopping. Move the whole chord shape at once.", q: "beginner guitar down strumming chord changes" },

    { id: "g2", title: "Strumming patterns", goal: "Keep a steady down-up motion and learn the pattern used in most pop songs.",
      drills: [
        { id: "g-strum8", name: "Down-up 8ths", pattern: "D U D U D U D U\n1 & 2 & 3 & 4 &", unit: "8th notes", ladder: [60, 70, 80, 90, 100, 110],
          how: "Down on the numbers, up on the '&'. The hand never stops, even when it misses the strings.", q: "guitar down up strumming 8th notes beginner" },
        { id: "g-pop", name: "The pop pattern", pattern: "D   D U   U D U\n1   2 &   & 4 &", unit: "8th notes", ladder: [60, 70, 80, 90, 100],
          how: "Beat 3 is a silent down strum: the hand moves but misses. Play it on G-D-Em-C, the most common chord loop in pop.", q: "D DU UDU strumming pattern lesson" },
        { id: "g-chuck", name: "Strum with a chop on 2 and 4", pattern: "D X U D X U\nX = hand flat on the strings", unit: "8th notes", ladder: [60, 70, 80, 90],

    { id: "g3", title: "More open chords", goal: "Add E, A, Dm and the 7th chords that turn up in blues and folk songs.",
      chords: ["E", "A", "Dm", "E7", "A7", "D7", "Cadd9"], changes: [["E", "A"], ["A", "D"], ["D", "Dm"], ["A7", "D7"], ["E7", "A7"], ["G", "Cadd9"]],
      drills: [
        { id: "g-blues", name: "12-bar blues in A", pattern: "A7 A7 A7 A7 | D7 D7 A7 A7 | E7 D7 A7 E7", unit: "8th notes", ladder: [60, 70, 80, 90, 100],
          how: "One bar per chord with down-up strums. Swing it slightly. The base of thousands of blues and rock songs.", q: "12 bar blues A beginner guitar" },
      ] },
    { id: "g4", title: "Barre and power chords", goal: "Play F and Bm without buzzing, and move power chords around the neck.",
      chords: ["F", "Bm", "B7", "E5", "A5", "G5"], changes: [["C", "F"], ["G", "Bm"], ["E5", "G5"], ["Am", "F"]],
      drills: [

    { id: "g5", title: "Picking, fingerpicking and scales", goal: "Clean alternate picking, a first fingerpicking pattern and the first scale shape for solos.",

          how: "One finger per fret, strict down-up picking. Keep fingers close to the strings. Best warm-up there is.", q: "guitar chromatic exercise 1234 alternate picking" },

  drums: [
    { id: "d1", title: "Strokes", goal: "Even single and double strokes with a relaxed rebound. Practise on a pad.",

        { id: "d-s8", name: "Single strokes, 8ths", pattern: "R L R L R L R L", unit: "8th notes", ladder: [60, 80, 100, 120, 140],

        { id: "d-acc", name: "Accents and taps", pattern: ">R L R L  >L R L R", unit: "8th notes", ladder: [60, 80, 100, 120],

let meta = null, logs = [], store = null, tab = "progress", pendingDelete = null, restoreArmed = false, restoreDraft = "", toastT;

// ---------- data ----------
function defaults() {

  for (const i of INSTS) skills[i] = CURRICULUM[i].map(([name, tip], n) => ({ id: i + "-" + n, name, tip, stage: 0, updated: null }));
  return { v: 1, skills, goals: { guitar: 90, drums: 90 }, drills: {}, chords: {}, changes: {} };
}
function normalize(d) {
  const base = defaults();
  return { ...base, ...d, skills: { guitar: d.skills?.guitar || base.skills.guitar, drums: d.skills?.drums || base.skills.drums },
    goals: { ...base.goals, ...(d.goals || {}) },
    drills: { ...(d.drills || {}) }, chords: { ...(d.chords || {}) }, changes: { ...(d.changes || {}) } };
}
function cloudStore(db, uid) {
  const root = db.doc("data/users/" + uid + "/music"), col = root.collection("logs");
  store = {
    saveMeta: m => root.set(m),
    addLog: l => col.doc(l.id).set(l),
    delLog: id => col.doc(id).delete(),
  };
  root.onSnapshot(s => {
    if (s.exists) meta = normalize(s.data()); else { meta = defaults(); root.set(meta); }
    render();
  }, () => toast("Couldn't load your progress. Reload the page to try again."));
  col.onSnapshot(snap => { logs = snap.docs.map(d => ({ id: d.id, ...d.data() })); render(); }, () => {});
}
function localStore() {
  let d = {};
  try { d = JSON.parse(localStorage.getItem("mp.data") || "{}") || {}; } catch {}
  meta = normalize(d.meta || {});
  logs = Array.isArray(d.logs) ? d.logs : [];
  const save = () => { try { localStorage.setItem("mp.data", JSON.stringify({ meta, logs })); } catch {} };
  store = {
    saveMeta: async m => { meta = m; save(); },
    addLog: async l => { logs = logs.filter(x => x.id !== l.id).concat(l); save(); },
    delLog: async id => { logs = logs.filter(x => x.id !== id); save(); },
  };
  note("Saved in this browser only. Open this page on claude.ai while signed in to keep it on every device.");
  render();
}
async function init() {
  let db = null, user = null, uid = null;

    try { [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]); uid = user ? await user.id() : null; } catch {}

  const days = new Set(logs.filter(l => l.inst === i && +l.min > 0).map(l => l.date));
  let d = today(); if (!days.has(ymd(d))) d = addDays(d, -1);

// ---------- metronome ----------
const metro = { on: false, bpm: 80, ctx: null, next: 0, beat: 0, timer: null };
const clampBpm = v => Math.max(30, Math.min(260, Math.round(v) || 80));
function metroClick(t, accent) {
  const c = metro.ctx, o = c.createOscillator(), g = c.createGain();
  o.frequency.value = accent ? 1600 : 1000;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(accent ? 0.7 : 0.4, t + 0.002);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + 0.06);
}
function metroTick() {
  while (metro.next < metro.ctx.currentTime + 0.1) { metroClick(metro.next, metro.beat % 4 === 0); metro.next += 60 / metro.bpm; metro.beat++; }
}
function metroStart(bpm) {
  if (bpm) metro.bpm = clampBpm(bpm);
  try { metro.ctx = metro.ctx || new (window.AudioContext || window.webkitAudioContext)(); if (metro.ctx.resume) metro.ctx.resume(); }
  catch { toast("This browser can't play the click."); return; }
  metro.on = true; metro.beat = 0; metro.next = metro.ctx.currentTime + 0.06;
  clearInterval(metro.timer); metro.timer = setInterval(metroTick, 25);
  syncMetro();
}
function metroStop() { metro.on = false; clearInterval(metro.timer); syncMetro(); }
function syncMetro() {
  const i = $("#metro-bpm"), b = $("#metro-toggle");
  if (i && document.activeElement !== i) i.value = metro.bpm;
  if (b) b.textContent = metro.on ? "Stop" : "Start";
}

  return `<div class="logrow i-${l.inst}"><time>${fmtDate(l.date)}</time>
    <span><b style="color:var(--i)">${NAME[l.inst]}</b> · ${l.min} min${l.skill ? " · " + esc(skillName(l.skill)) : ""}${l.note ? `<small>${esc(l.note)}</small>` : ""}</span>
    <button class="btn sm ${del ? "danger" : "warn"}" type="button" data-act="dellog" data-id="${esc(l.id)}">${del ? "Tap again to delete" : "Delete"}</button></div>`;
}
function skillRow(s) {
  const due = isDue(s);
  const touched = s.updated ? "Last changed " + fmtDate(ymd(new Date(s.updated))) : "Not started";
  return `<div class="skill">
    <div class="row between"><strong>${esc(s.name)}</strong>
      <select data-act="stage" data-id="${esc(s.id)}" aria-label="Stage for ${esc(s.name)}">${STAGES.map((t, k) => `<option value="${k}" ${k === s.stage ? "selected" : ""}>${k}. ${t}</option>`).join("")}</select></div>
    <div class="row between"><span class="stag ${due ? "due" : ""}">${touched}${due ? " · due for review" : ""}</span>${dotsOf(s)}</div>
    <details><summary>What to focus on</summary><p class="small">${esc(s.tip || "Add a note about this skill.")}</p></details>
    ${s.custom ? `<div><button class="btn sm warn" type="button" data-act="delskill" data-id="${esc(s.id)}">${pendingDelete === s.id ? "Tap again to delete" : "Delete"}</button></div>` : ""}
  </div>`;
}
function skillsView() {
  return INSTS.map(i => `<section class="skillgroup i-${i}"><h2>${NAME[i]}</h2>
      ${skills(i).map(skillRow).join("")}</section>`).join("") +
    `<form class="card" id="addskill" data-act="addskill">
      <h3>Add your own skill</h3>
      <div class="form">
        <label>Instrument<select name="inst">${INSTS.map(i => `<option value="${i}">${NAME[i]}</option>`).join("")}</select></label>
        <label>Skill<input type="text" name="name" maxlength="60" placeholder="e.g. Hammer-ons" required></label>
      </div>
      <div class="row"><button class="btn primary" type="submit">Add skill</button></div>
    </form>`;
}
// ---------- lessons view ----------
function chordSVG(name) {
  const c = CHORDS[name], f = c.f, pos = f.filter(x => x > 0), max = Math.max(0, ...pos);
  const start = max > 5 ? Math.min(...pos) : 1;
  const X = s => 14 + s * 12, Y = k => 22 + k * 15;
  let g = "";
  for (let k = 0; k <= 5; k++) g += `<line x1="14" y1="${Y(k)}" x2="74" y2="${Y(k)}" stroke="currentColor" stroke-width="${k === 0 && start === 1 ? 3 : 1}" opacity="${k === 0 && start === 1 ? 1 : .45}"/>`;
  for (let s = 0; s < 6; s++) g += `<line x1="${X(s)}" y1="${Y(0)}" x2="${X(s)}" y2="${Y(5)}" stroke="currentColor" opacity=".6"/>`;
  if (start > 1) g += `<text x="78" y="${Y(0) + 11}" font-size="9" fill="currentColor">${start}fr</text>`;
  if (c.barre) {
    const s0 = f.findIndex(x => x === c.barre), y = Y(c.barre - start) + 7.5;
    g += `<rect x="${X(s0) - 5}" y="${y - 5}" width="${X(5) - X(s0) + 10}" height="10" rx="5" fill="var(--i)"/>`;
  }
  f.forEach((fr, s) => {
    if (fr < 0) g += `<text x="${X(s)}" y="16" font-size="11" text-anchor="middle" fill="currentColor" opacity=".7">×</text>`;
    else if (fr === 0) g += `<circle cx="${X(s)}" cy="12" r="3.5" fill="none" stroke="currentColor" stroke-width="1.3"/>`;
    else if (!(c.barre && fr === c.barre)) {
      const y = Y(fr - start) + 7.5;
      g += `<circle cx="${X(s)}" cy="${y}" r="5.5" fill="var(--i)"/>`;
      if (c.fi[s]) g += `<text x="${X(s)}" y="${y + 3}" font-size="8" font-weight="700" text-anchor="middle" fill="var(--surface)">${c.fi[s]}</text>`;
    }
  });
  const desc = f.map(x => x < 0 ? "x" : x).join(" ");
  return `<svg viewBox="0 0 90 100" role="img" aria-label="${name} chord, strings low to high: ${desc}">${g}</svg>`;
}
function chordCard(name) {
  const st = chordStage(name);
  return `<div class="chord">${chordSVG(name)}<strong>${name}</strong>
    <select data-act="cstage" data-c="${name}" aria-label="How well you play ${name}">${CHORD_STAGES.map((t, k) => `<option value="${k}" ${k === st ? "selected" : ""}>${k}. ${t}</option>`).join("")}</select>
    ${dotsOf({ stage: st }, CHORD_STAGES)}
    <a class="mini" href="${YT("how to play " + name + " chord guitar beginner")}" target="_blank" rel="noopener">Video ↗</a></div>`;
}
function changeRow(p) {
  const k = p.join("-"), b = (meta.changes[k] || {}).best || 0;
  return `<div class="chg"><b>${p[0]} ↔ ${p[1]}</b>
    <label class="inline">Best in 1 minute<input type="number" min="0" max="200" inputmode="numeric" value="${b || ""}" placeholder="0" data-act="cbest" data-k="${k}"></label>
    <div class="bar" aria-hidden="true"><i style="width:${Math.min(100, b / 60 * 100)}%"></i></div>
    <span class="mini">${b >= 60 ? "Automatic" : b >= 30 ? "Good, aim for 60" : "Aim for 30"}</span></div>`;
}
function drillRow(d) {
  const b = drillBest(d), st = drillStage(d), top = d.ladder[d.ladder.length - 1], next = d.ladder.find(x => x > b) || top;
  return `<div class="drill">
    <div class="row between"><strong>${esc(d.name)}</strong>${dotsOf({ stage: st })}</div>
    <code class="pat">${esc(d.pattern)}</code>
    <p class="small">${esc(d.how)}</p>
    <div class="row" role="group" aria-label="Tempo steps for ${esc(d.name)}"><span class="mini">${esc(d.unit)}, clean at</span>
      ${d.ladder.map(x => `<button type="button" class="chip ${x <= b ? "on" : ""}" data-act="ladder" data-id="${d.id}" data-bpm="${x}" aria-pressed="${x <= b}">${x}</button>`).join("")}<span class="mini">BPM</span></div>
    <div class="row"><button class="btn sm inst" type="button" data-act="mplay" data-bpm="${next}">▶ Click at ${next} BPM</button>
      <a class="small" href="${YT(d.q)}" target="_blank" rel="noopener">Find a video lesson ↗</a>
      ${b ? `<span class="mini">Best ${b} BPM${b >= top ? " · goal reached" : " · goal " + top}</span>` : `<span class="mini">Goal ${top} BPM</span>`}</div>
  </div>`;
}
function lessonBody(l) {
  let h = "";
  if (l.chords?.length) h += `<h3>Chords</h3><p class="small muted">Rate each chord as you go. Stage 5 means you can switch to it on every beat.</p><div class="chords">${l.chords.map(chordCard).join("")}</div>`;
  if (l.changes?.length) h += `<h3>One-minute changes</h3><p class="small muted">Set a 60-second timer and switch between the two chords as many times as you can, one strum per change. Count only clean changes and enter your best.</p><div class="list">${l.changes.map(changeRow).join("")}</div>`;
  if (l.drills?.length) h += `<h3>${lessonInst === "drums" ? "Strokes and grooves" : "Drills"}</h3><p class="small muted">Start the click at the first tempo. When you play it cleanly 3 times in a row, tap that tempo and move up one step.</p><div class="list">${l.drills.map(drillRow).join("")}</div>`;
  return h;
}
function lessonCard(l, n) {
  const p = lessonPct(l), open = openLesson === l.id;
  return `<section class="card lesson i-${lessonInst}">
    <button class="lhead" type="button" data-act="lopen" data-id="${l.id}" aria-expanded="${open}">
      <span class="lnum">${pad(n)}</span><span class="ltitle"><strong>${esc(l.title)}</strong><span class="small muted">${esc(l.goal)}</span></span><span class="lpct">${p}%</span></button>
    <div class="bar"><i style="width:${p}%"></i></div>
    ${open ? lessonBody(l) : ""}
  </section>`;
}
function metroBar() {
  return `<div class="card metro i-${lessonInst}"><div class="row between"><h3>Metronome</h3><span class="mini">4/4, accent on beat 1</span></div>
    <div class="row"><button class="btn sm" type="button" data-act="mbpm" data-d="-5" aria-label="5 BPM slower">−5</button>
      <input type="number" id="metro-bpm" class="bpm" min="30" max="260" value="${metro.bpm}" data-act="mset" aria-label="Tempo in BPM"><span class="mini">BPM</span>
      <button class="btn sm" type="button" data-act="mbpm" data-d="5" aria-label="5 BPM faster">+5</button>
      <button class="btn primary" type="button" id="metro-toggle" data-act="mtoggle">${metro.on ? "Stop" : "Start"}</button></div></div>`;
}
function lessonsView() {
  const ls = LESSONS[lessonInst];
  if (openLesson === "auto") openLesson = (ls.find(l => lessonPct(l) < 100) || ls[0]).id;
  return metroBar() +
    `<div class="row" role="group" aria-label="Instrument">${INSTS.map(i => `<button type="button" class="btn ${i === lessonInst ? "primary" : ""}" data-act="linst" data-i="${i}" aria-pressed="${i === lessonInst}">${NAME[i]}</button>`).join("")}</div>` +
    ls.map((l, n) => lessonCard(l, n + 1)).join("");
}

// ---------- tips view ----------
function tipsView() {
  const links = [
    ["JustinGuitar: free beginner guitar course", "https://www.justinguitar.com/"],
    ["Beginner guitar lessons on YouTube", YT("JustinGuitar beginner guitar course lesson 1")],
    ["One-minute changes explained", YT("one minute changes guitar justin")],
    ["Beginner drum lessons on YouTube", YT("drumeo first drum lesson beginner")],
    ["The 40 essential drum rudiments", YT("40 essential drum rudiments")],
    ["Backing tracks to jam over", YT("A minor backing track slow")],
  ];
  return TIPS.map(t => `<section class="card tips ${t.inst ? "i-" + t.inst : ""}"><h3>${esc(t.title)}</h3><ul>${t.items.map(x => `<li>${x}</li>`).join("")}</ul></section>`).join("") +
    `<section class="card tips"><h3>Tempo guide</h3>
      <div class="tempos">${[["Slow ballad", "60–80"], ["Pop", "90–120"], ["Rock", "110–140"], ["Dance", "120–128"], ["Punk", "160+"]].map(([a, b]) => `<div><b>${b}</b><span>${a}</span></div>`).join("")}</div>
      <p class="small muted">BPM = beats per minute. Most beginner goals in the lessons stop around 100–120, the speed of a typical pop or rock song.</p></section>` +
    `<section class="card tips"><h3>Where to learn more</h3><ul>${links.map(([t, u]) => `<li><a href="${u}" target="_blank" rel="noopener">${esc(t)} ↗</a></li>`).join("")}</ul>
      <p class="small muted">Video links open a YouTube search, so you can pick a teacher you like.</p></section>`;
}

function backupText() {
  return JSON.stringify({ app: "music-progress", v: 1, exported: new Date().toISOString(), meta, logs }, null, 1);
}
function backupView() {
  return `<section class="card backup">
      <h3>Back up your progress</h3>
      <p class="small muted">Your progress saves to your account automatically. To keep a copy, copy the text below and store it somewhere safe.</p>
      <div class="row"><button class="btn" type="button" data-act="copy">Copy backup</button><span class="status" id="backupstatus"></span></div>
      <textarea id="backuptext" readonly aria-label="Backup text">${esc(backupText())}</textarea>
    </section>
    <section class="card backup">
      <h3>Restore from a backup</h3>
      <p class="small muted">Paste backup text here. Its skills and goals replace yours, and its sessions are added. Sessions you already have stay.</p>
      <textarea id="restoretext" placeholder="Paste backup text here" aria-label="Backup text to restore">${esc(restoreDraft)}</textarea>
      <div class="row"><button class="btn warn" type="button" data-act="restore">${restoreArmed ? "Tap again to restore" : "Restore from backup"}</button><span class="status" id="restorestatus"></span></div>
    </section>`;
}

// ---------- events ----------
async function restoreFrom(text) {
  let b;
  try { b = JSON.parse(text); } catch { return "That text isn't a valid backup."; }
  if (!b || b.app !== "music-progress" || !b.meta) return "That text isn't a Guitar & Drums backup.";
  meta = normalize(b.meta);
  await store.saveMeta(meta);
  for (const l of b.logs || []) await store.addLog(l);
  return "Backup restored.";
}
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]");
  if (!el || el.tagName === "INPUT" || el.tagName === "SELECT") return;
  const act = el.dataset.act;
  if (act === "tab") {
    tab = el.dataset.t; pendingDelete = null; restoreArmed = false;
    if (el.dataset.i) { lessonInst = el.dataset.i; openLesson = "auto"; }
    if (tab !== "lessons" && metro.on) metroStop();
    render(); window.scrollTo({ top: 0 }); return;
  }
  if (act === "linst") { lessonInst = el.dataset.i; openLesson = "auto"; render(); return; }
  if (act === "lopen") { openLesson = openLesson === el.dataset.id ? null : el.dataset.id; render(); return; }
  if (act === "ladder") {
    const d = allDrills().find(x => x.id === el.dataset.id), bpm = +el.dataset.bpm; if (!d) return;
    const best = drillBest(d) >= bpm ? (d.ladder.filter(x => x < bpm).pop() || 0) : bpm;
    meta.drills = { ...meta.drills, [d.id]: { best, updated: Date.now() } };
    save(); return;
  }
  if (act === "mtoggle") { if (metro.on) metroStop(); else metroStart(); return; }
  if (act === "mbpm") { metro.bpm = clampBpm(metro.bpm + +el.dataset.d); syncMetro(); return; }
  if (act === "mplay") { metroStart(+el.dataset.bpm); window.scrollTo({ top: $("#metro-bpm").getBoundingClientRect().top + window.scrollY - 80, behavior: "smooth" }); return; }
  if (act === "quick") {
    await store.addLog({ id: uid(), inst: el.dataset.i, min: 15, date: ymd(today()), skill: "", note: "" });
    toast("Added 15 minutes of " + NAME[el.dataset.i].toLowerCase() + ".");
    render(); return;
  }
  if (act === "dellog") {
    const id = el.dataset.id;
    if (pendingDelete !== id) { pendingDelete = id; render(); return; }
    pendingDelete = null; await store.delLog(id); render(); return;
  }
  if (act === "delskill") {
    const id = el.dataset.id;
    if (pendingDelete !== id) { pendingDelete = id; render(); return; }
    pendingDelete = null;
    for (const i of INSTS) meta.skills[i] = meta.skills[i].filter(s => s.id !== id);
    save(); return;
  }
  if (act === "copy") {
    const t = $("#backuptext");
    try { await navigator.clipboard.writeText(t.value); $("#backupstatus").textContent = "Copied."; }
    catch { t.select(); $("#backupstatus").textContent = "Copy was blocked. Press Ctrl+C with the text selected."; }
    return;
  }
  if (act === "restore") {
    const txt = restoreDraft.trim();
    if (!txt) { $("#restorestatus").textContent = "Paste a backup first."; return; }
    if (!restoreArmed) { restoreArmed = true; el.textContent = "Tap again to restore"; return; }
    restoreArmed = false;
    const msg = await restoreFrom(txt);
    restoreDraft = "";
    render(); $("#restorestatus").textContent = msg;
    return;
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "restoretext") { restoreDraft = e.target.value; restoreArmed = false; }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.act === "stage") {
    const s = allSkills().find(x => x.id === el.dataset.id); if (!s) return;
    s.stage = +el.value; s.updated = s.stage ? Date.now() : null; save(); return;
  }
  if (el.dataset.act === "cstage") {
    meta.chords = { ...meta.chords, [el.dataset.c]: { stage: +el.value, updated: Date.now() } }; save(); return;
  }
  if (el.dataset.act === "cbest") {
    const v = Math.max(0, Math.min(200, Math.round(+el.value) || 0));
    meta.changes = { ...meta.changes, [el.dataset.k]: { best: v, updated: Date.now() } }; save(); return;
  }
  if (el.dataset.act === "mset") { metro.bpm = clampBpm(+el.value); syncMetro(); return; }
  if (el.dataset.act === "goal") {
    const v = Math.max(0, Math.min(1000, Math.round(+el.value) || 0));
    meta.goals[el.dataset.i] = v; save();
  }
});
document.addEventListener("submit", async e => {
  const form = e.target;
  e.preventDefault();
  if (form.dataset.act === "savelog") {
    const f = new FormData(form), min = Math.round(+f.get("min"));
    if (!(min > 0)) { $("#logstatus").textContent = "Enter the minutes you practised."; return; }
    await store.addLog({ id: uid(), inst: f.get("inst"), min, date: f.get("date") || ymd(today()), skill: f.get("skill") || "", note: (f.get("note") || "").trim() });
    render(); $("#logstatus").textContent = "Saved.";
    return;
  }
  if (form.dataset.act === "addskill") {
    const f = new FormData(form), name = (f.get("name") || "").trim(), inst = f.get("inst");
    if (!name) return;
    meta.skills[inst] = [...skills(inst), { id: uid(), name, tip: "", stage: 0, updated: null, custom: true }];
    save(); return;
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && pendingDelete) { pendingDelete = null; render(); } });

init();
</script>
</body>
</html>
